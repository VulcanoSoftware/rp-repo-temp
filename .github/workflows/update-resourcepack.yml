name: Update Resource Pack (GitHub tag 1.0)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-1-0:
    runs-on: ubuntu-latest
    if: github.event.release.tag_name != '1.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # <-- pas aan naar je standaardbranch als die anders heet (bv. master)

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Process uploaded zip files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMP_TAG: ${{ github.event.release.tag_name }}
          TARGET_TAG: "1.0"
        run: |
          set -e

          echo "Tijdelijke release: $TEMP_TAG → doel: $TARGET_TAG"

          # Zorg dat tag 1.0 bestaat
          if ! gh release view "$TARGET_TAG" > /dev/null 2>&1; then
            gh release create "$TARGET_TAG" --title "Resource Pack 1.0" --notes "Permanente release"
          fi

          TEMP_ASSETS=$(gh release view "$TEMP_TAG" --json assets -q '.assets[] | select(.name | test("\\.zip$"; "i")) | {name: .name, url: .url}')

          if [ -z "$TEMP_ASSETS" ]; then
            echo "Geen .zip bestanden gevonden."
            exit 0
          fi

          CURRENT_ASSETS=$(gh api "repos/${{ github.repository }}/releases/tags/$TARGET_TAG" --jq '.assets[] | {name: .name}')

          echo "$TEMP_ASSETS" | jq -c '.' | while read -r asset; do
            ORIGINAL_NAME=$(echo "$asset" | jq -r '.name')
            DOWNLOAD_URL=$(echo "$asset" | jq -r '.url')
            LOWER_NAME=$(echo "$ORIGINAL_NAME" | tr '[:upper:]' '[:lower:]')

            echo ""
            echo "=== Verwerken: $ORIGINAL_NAME ==="

            MATCHING_NAME=""
            while read -r current; do
              CURRENT_NAME=$(echo "$current" | jq -r '.name')
              if [ "$(echo "$CURRENT_NAME" | tr '[:upper:]' '[:lower:]')" = "$LOWER_NAME" ]; then
                MATCHING_NAME="$CURRENT_NAME"
                break
              fi
            done <<< "$(echo "$CURRENT_ASSETS" | jq -c '.')"

            curl -sL -H "Accept: application/octet-stream" -H "Authorization: token $GH_TOKEN" \
              -o "new_pack.zip" "$DOWNLOAD_URL"

            SHA1=$(sha1sum new_pack.zip | awk '{print $1}')
            echo "SHA-1: $SHA1"

            if [ -n "$MATCHING_NAME" ]; then
              echo "Update van bestaande file: $MATCHING_NAME"
              gh release delete-asset "$TARGET_TAG" "$MATCHING_NAME" --yes || true
              gh release delete-asset "$TARGET_TAG" "${MATCHING_NAME}.sha1" --yes || true
              FINAL_NAME="$MATCHING_NAME"
            else
              echo "Nieuw bestand"
              FINAL_NAME="$ORIGINAL_NAME"
            fi

            echo -n "$SHA1" > "${FINAL_NAME}.sha1"
            mv new_pack.zip "$FINAL_NAME"
            gh release upload "$TARGET_TAG" "$FINAL_NAME" "${FINAL_NAME}.sha1" --clobber

            echo "Klaar: $FINAL_NAME"
          done

      - name: Commit pack files naar repository (nodig voor jsDelivr)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Voeg alleen de zip- en sha1-bestanden toe die in de vorige stap zijn neergezet
          git add -A -- '*.zip' '*.zip.sha1'

          if ! git diff --cached --quiet; then
            git commit -m "Update resource pack bestanden (release sync)"
            git push origin HEAD:main
            echo "Wijzigingen gecommit en gepusht."
          else
            echo "Geen bestandswijzigingen om te committen."
          fi

          # Verplaats de git-tag 1.0 naar de nieuwste commit zodat jsDelivr
          # via @1.0 altijd de laatste inhoud serveert.
          git tag -f "1.0"
          git push origin "1.0" --force

      - name: Verwijder tijdelijke release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMP_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release delete "$TEMP_TAG" --yes --cleanup-tag
          echo "Tijdelijke release verwijderd."
