name: Update Resource Pack (GitHub tag 1.0)

on:
  # Tijdelijke release publiceren (of aanpassen) EN rechtstreeks wijzigingen in release 1.0
  release:
    types: [published, edited]
  # Handmatig starten: alleen release 1.0 opnieuw controleren/opruimen
  workflow_dispatch:

permissions:
  contents: write

# Nooit twee runs tegelijk op release 1.0; een tweede run wacht op de eerste
concurrency:
  group: update-resourcepack
  cancel-in-progress: false

jobs:
  update-1-0:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TARGET_TAG: "1.0"
      TEMP_TAG: ${{ github.event.release.tag_name }}

    steps:
      # ------------------------------------------------------------------
      # 1. Tijdelijke release: zips verplaatsen naar release 1.0
      # ------------------------------------------------------------------
      - name: Zips van tijdelijke release naar 1.0 verplaatsen
        if: ${{ github.event_name == 'release' && github.event.release.tag_name != '1.0' }}
        run: |
          set -e
          echo "Tijdelijke release: $TEMP_TAG → doel: $TARGET_TAG"

          if ! gh release view "$TEMP_TAG" > /dev/null 2>&1; then
            echo "Tijdelijke release bestaat niet (meer); niets te verplaatsen."
            exit 0
          fi

          # Zorg dat release 1.0 bestaat
          if ! gh release view "$TARGET_TAG" > /dev/null 2>&1; then
            gh release create "$TARGET_TAG" --title "Resource Pack 1.0" --notes "Permanente release"
          fi

          WORKDIR=$(mktemp -d)

          TEMP_NAMES=$(gh release view "$TEMP_TAG" --json assets -q '.assets[].name' | { grep -iE '\.zip$' || true; })
          if [ -z "$TEMP_NAMES" ]; then
            echo "Geen .zip bestanden gevonden."
            exit 0
          fi

          CURRENT_NAMES=$(gh release view "$TARGET_TAG" --json assets -q '.assets[].name')

          echo "$TEMP_NAMES" | while read -r ORIGINAL_NAME; do
            echo ""
            echo "=== Verwerken: $ORIGINAL_NAME ==="

            # Bestaat dezelfde naam al in 1.0? (niet hoofdlettergevoelig)
            MATCHING_NAME=$(echo "$CURRENT_NAMES" | { grep -ixF -- "$ORIGINAL_NAME" || true; } | head -n 1)

            if [ -n "$MATCHING_NAME" ]; then
              echo "Update van bestaande file: $MATCHING_NAME"
              FINAL_NAME="$MATCHING_NAME"
            else
              echo "Nieuw bestand"
              FINAL_NAME="$ORIGINAL_NAME"
            fi

            # Eerst downloaden, pas daarna iets verwijderen
            gh release download "$TEMP_TAG" --pattern "$ORIGINAL_NAME" --output "$WORKDIR/$FINAL_NAME" --clobber < /dev/null

            if [ -n "$MATCHING_NAME" ]; then
              gh release delete-asset "$TARGET_TAG" "$MATCHING_NAME" --yes < /dev/null || true
              gh release delete-asset "$TARGET_TAG" "${MATCHING_NAME}.sha1" --yes < /dev/null || true
            fi

            gh release upload "$TARGET_TAG" "$WORKDIR/$FINAL_NAME" --clobber < /dev/null
            rm -f "$WORKDIR/$FINAL_NAME"
            echo "Klaar: $FINAL_NAME"
          done

      # ------------------------------------------------------------------
      # 2. Altijd: release 1.0 in orde brengen
      #    - van elke zip wordt de SHA-1 opnieuw berekend en zo nodig bijgewerkt
      #    - .sha1 bestanden zonder bijbehorende zip worden verwijderd
      # ------------------------------------------------------------------
      - name: Release 1.0 controleren (SHA-1 bijwerken, weeskinderen opruimen)
        run: |
          set -e

          if ! gh release view "$TARGET_TAG" > /dev/null 2>&1; then
            echo "Release $TARGET_TAG bestaat niet; niets te doen."
            exit 0
          fi

          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"

          ASSET_NAMES=$(gh release view "$TARGET_TAG" --json assets -q '.assets[].name')

          # a) SHA-1 van elke zip opnieuw berekenen
          echo "$ASSET_NAMES" | { grep -iE '\.zip$' || true; } | while read -r NAME; do
            gh release download "$TARGET_TAG" --pattern "$NAME" --clobber < /dev/null
            NEW=$(sha1sum "$NAME" | awk '{print $1}')
            OLD=$(gh release download "$TARGET_TAG" --pattern "${NAME}.sha1" --output - < /dev/null 2>/dev/null | tr -d '[:space:]' || true)

            if [ "$NEW" != "$OLD" ]; then
              echo "SHA-1 bijwerken voor $NAME: $NEW"
              echo -n "$NEW" > "${NAME}.sha1"
              gh release upload "$TARGET_TAG" "${NAME}.sha1" --clobber < /dev/null
            else
              echo "SHA-1 klopt al voor $NAME"
            fi
            rm -f "$NAME" "${NAME}.sha1"
          done

          # b) .sha1 bestanden zonder bijbehorende zip verwijderen
          echo "$ASSET_NAMES" | { grep -E '\.sha1$' || true; } | while read -r SHA_NAME; do
            ZIP_NAME="${SHA_NAME%.sha1}"
            if ! echo "$ASSET_NAMES" | grep -Fxq -- "$ZIP_NAME"; then
              echo "Wees-bestand verwijderen: $SHA_NAME (zip $ZIP_NAME bestaat niet meer)"
              gh release delete-asset "$TARGET_TAG" "$SHA_NAME" --yes < /dev/null
            fi
          done

      # ------------------------------------------------------------------
      # 3. Tijdelijke release opruimen (nooit release 1.0 zelf!)
      # ------------------------------------------------------------------
      - name: Verwijder tijdelijke release
        if: ${{ github.event_name == 'release' && github.event.release.tag_name != '1.0' }}
        run: |
          if gh release view "$TEMP_TAG" > /dev/null 2>&1; then
            gh release delete "$TEMP_TAG" --yes --cleanup-tag
            echo "Tijdelijke release verwijderd."
          else
            echo "Tijdelijke release bestond al niet meer."
          fi
