name: Sync to GitLab

on:
  workflow_run:
    workflows: ["Update Resource Pack (GitHub tag 1.0)"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sL https://raw.githubusercontent.com/profclems/glab/trunk/scripts/install.sh | sudo bash

      - name: Sync GitHub → GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: "1.0"
          GITLAB_REPO: "vulcanosoftwareinc/rp-repo-temp"
        run: |
          set -e

          echo "=== Start synchronisatie GitHub → GitLab ==="

          echo "$GITLAB_TOKEN" | glab auth login --stdin --hostname gitlab.com

          PROJECT_API="https://gitlab.com/api/v4/projects/$(echo $GITLAB_REPO | sed 's/\//%2F/g')"
          FILE_API="$PROJECT_API/repository/files/README.md"

          # -------------------------------------------------------
          # 1. Zorg dat er een geldige commit op main staat
          # -------------------------------------------------------
          echo "README.md forceren op branch main..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$FILE_API?ref=main")

          if [ "$HTTP_CODE" = "200" ]; then
            curl -s --request PUT \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{
                "branch": "main",
                "content": "# Resource Pack Mirror\n\nAutomatisch gesynchroniseerd vanaf GitHub.\n",
                "commit_message": "Update README (sync)"
              }' \
              "$FILE_API" > /dev/null
          else
            curl -s --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{
                "branch": "main",
                "content": "# Resource Pack Mirror\n\nAutomatisch gesynchroniseerd vanaf GitHub.\n",
                "commit_message": "Initialize repository with README"
              }' \
              "$FILE_API" > /dev/null
          fi

          echo "README.md is aanwezig"

          # -------------------------------------------------------
          # 2. Zorg dat release 1.0 bestaat
          # -------------------------------------------------------
          if ! glab release view "$TARGET_TAG" --repo "$GITLAB_REPO" > /dev/null 2>&1; then
            echo "Release $TARGET_TAG wordt aangemaakt"
            glab release create "$TARGET_TAG" \
              --repo "$GITLAB_REPO" \
              --name "Resource Pack 1.0" \
              --notes "Automatisch gesynchroniseerd vanaf GitHub" \
              --ref "main"
          else
            echo "Release $TARGET_TAG bestaat al"
          fi

          # -------------------------------------------------------
          # 3. Bestanden uploaden via Generic Package Registry
          # -------------------------------------------------------
          echo "Bestanden synchroniseren via Generic Packages..."

          ASSETS=$(gh release view "$TARGET_TAG" --repo "${{ github.repository }}" --json assets -q '.assets[] | {name: .name, url: .url}')

          if [ -z "$ASSETS" ]; then
            echo "Geen bestanden gevonden op GitHub"
            exit 0
          fi

          echo "$ASSETS" | jq -c '.' | while read -r asset; do
            NAME=$(echo "$asset" | jq -r '.name')
            URL=$(echo "$asset" | jq -r '.url')

            echo "→ Uploaden: $NAME"

            # Download van GitHub
            curl -sL -H "Accept: application/octet-stream" -H "Authorization: token $GH_TOKEN" \
              -o "$NAME" "$URL"

            # Upload naar GitLab Generic Package Registry
            # URL wordt: /packages/generic/resource-pack/1.0/FILENAME
            UPLOAD_URL="$PROJECT_API/packages/generic/resource-pack/$TARGET_TAG/$NAME"

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --upload-file "$NAME" \
              "$UPLOAD_URL")

            if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
              echo "   Succesvol geüpload (HTTP $HTTP_STATUS)"
            else
              echo "   Fout bij uploaden (HTTP $HTTP_STATUS)"
              exit 1
            fi
          done

          echo "=== Synchronisatie succesvol voltooid ==="
          echo ""
          echo "Bestanden zijn bereikbaar via:"
          echo "https://gitlab.com/$GITLAB_REPO/-/packages/"
