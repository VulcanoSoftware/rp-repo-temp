name: Sync to GitLab

on:
  # Automatisch na een geslaagde GitHub update
  workflow_run:
    workflows: ["Update Resource Pack (GitHub tag 1.0)"]
    types:
      - completed

  # Ook handmatig te starten
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Alleen draaien als de vorige workflow geslaagd is (of handmatig gestart)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install glab
        run: curl -sL https://raw.githubusercontent.com/profclems/glab/trunk/scripts/install.sh | sudo bash

      - name: Sync GitHub → GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: "1.0"
          GITLAB_REPO: "vulcanosoftwareinc/rp-repo-temp"
        run: |
          set -e

          echo "Synchroniseren van GitHub tag $TARGET_TAG → GitLab..."

          echo "$GITLAB_TOKEN" | glab auth login --stdin --hostname gitlab.com

          # Zorg dat release 1.0 bestaat op GitLab
          if ! glab release view "$TARGET_TAG" --repo "$GITLAB_REPO" > /dev/null 2>&1; then
            glab release create "$TARGET_TAG" --repo "$GITLAB_REPO" \
              --name "Resource Pack 1.0" \
              --notes "Automatisch gesynchroniseerd vanaf GitHub"
          fi

          # Alle assets van GitHub 1.0 ophalen
          ASSETS=$(gh release view "$TARGET_TAG" --repo "${{ github.repository }}" --json assets -q '.assets[] | {name: .name, url: .url}')

          echo "$ASSETS" | jq -c '.' | while read -r asset; do
            NAME=$(echo "$asset" | jq -r '.name')
            URL=$(echo "$asset" | jq -r '.url')

            echo "→ $NAME"

            curl -sL -H "Accept: application/octet-stream" -H "Authorization: token $GH_TOKEN" \
              -o "$NAME" "$URL"

            glab release upload "$TARGET_TAG" "$NAME" --repo "$GITLAB_REPO" --clobber
          done

          echo "Synchronisatie voltooid."
