name: Sync to GitLab + SourceForge

on:
  workflow_run:
    workflows: ["Update Resource Pack (GitHub tag 1.0)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

# Nooit twee syncs tegelijk; een tweede run wacht tot de eerste klaar is
concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Draait alleen na een geslaagde update-resourcepack run (of handmatig)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Update-resourcepack draait nu bij elke push; hier voorkomen we dat dan telkens
      # alles opnieuw naar GitLab en SourceForge wordt geüpload. We vergelijken de
      # bestanden van release 1.0 met de toestand van de laatste geslaagde sync.
      - name: Is release 1.0 veranderd sinds de vorige sync?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: "1.0"
        run: |
          set -e
          if ! gh release view "$TARGET_TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TARGET_TAG bestaat niet; sync overgeslagen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(gh release view "$TARGET_TAG" --repo "${{ github.repository }}" --json assets \
            -q '.assets[] | "\(.id) \(.name) \(.size)"' | sort | sha256sum | awk '{print $1}')
          PREVIOUS=$(cat .mirror-state 2>/dev/null || true)

          echo "state=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Handmatig gestart: sync wordt altijd uitgevoerd."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "Release $TARGET_TAG is veranderd: sync wordt uitgevoerd."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Geen wijzigingen aan release $TARGET_TAG sinds de vorige sync; sync overgeslagen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: ${{ steps.check.outputs.changed == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync
          curl -sL https://raw.githubusercontent.com/profclems/glab/trunk/scripts/install.sh | sudo bash

      - name: SourceForge SSH instellen (IdentitiesOnly)
        if: ${{ steps.check.outputs.changed == 'true' }}
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Windows-regeleindes weghalen en zorgen voor een afsluitende newline
          printf '%s\n' "$SF_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Controleer dat de key geldig is en toon de fingerprint (vergelijk met SourceForge)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub

          # Dit lost de "Too many authentication failures" op
          printf '%s\n' \
            'Host frs.sourceforge.net' \
            '    IdentityFile ~/.ssh/id_ed25519' \
            '    IdentitiesOnly yes' \
            '    BatchMode yes' \
            '    StrictHostKeyChecking no' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config

          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync GitHub → GitLab + SourceForge + generate mirrors.txt
        if: ${{ steps.check.outputs.changed == 'true' }}
        env:
          MIRROR_STATE: ${{ steps.check.outputs.state }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: "1.0"
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
          SF_USER: ${{ secrets.SF_USER }}
          SF_PROJECT: "vulcanocraft-resourcepack-src"
        run: |
          set -e
          echo "=== Start synchronisatie GitHub → GitLab + SourceForge ==="
          echo "$GITLAB_TOKEN" | glab auth login --stdin --hostname gitlab.com

          PROJECT_API="https://gitlab.com/api/v4/projects/$(echo $GITLAB_REPO | sed 's/\//%2F/g')"
          PACKAGE_BASE="https://gitlab.com/api/v4/projects/$(echo $GITLAB_REPO | sed 's/\//%2F/g')/packages/generic/resource-pack/$TARGET_TAG"
          SF_REMOTE_DIR="/home/frs/project/${SF_PROJECT}/${TARGET_TAG}"

          # 1. Release volledig verwijderen
          echo "Verwijderen van release $TARGET_TAG..."
          if glab release view "$TARGET_TAG" --repo "$GITLAB_REPO" > /dev/null 2>&1; then
            glab release delete "$TARGET_TAG" --repo "$GITLAB_REPO" --yes
          fi

          # 2. README forceren
          echo "README.md forceren op branch main..."
          FILE_API="$PROJECT_API/repository/files/README.md"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$FILE_API?ref=main")
          if [ "$HTTP_CODE" = "200" ]; then
            curl -s --request PUT \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{
                "branch": "main",
                "content": "# Resource Pack Mirror\n\nAutomatisch gesynchroniseerd vanaf GitHub.\n",
                "commit_message": "Update README (sync)"
              }' \
              "$FILE_API" > /dev/null
          else
            curl -s --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{
                "branch": "main",
                "content": "# Resource Pack Mirror\n\nAutomatisch gesynchroniseerd vanaf GitHub.\n",
                "commit_message": "Initialize repository with README"
              }' \
              "$FILE_API" > /dev/null
          fi

          # 3. Nieuwe release 1.0 maken
          echo "Nieuwe release 1.0 maken..."
          glab release create "$TARGET_TAG" \
            --repo "$GITLAB_REPO" \
            --name "Resource Pack 1.0" \
            --notes "Automatisch gesynchroniseerd vanaf GitHub (overschreven)" \
            --ref "main"

          # 4. SourceForge-map klaarzetten (FRS heeft geen shell en een oude rsync zonder --mkpath,
          #    dus de map wordt aangemaakt door een lege lokale map te synchroniseren)
          echo "SourceForge-map voorbereiden..."
          EMPTY_DIR=$(mktemp -d)
          mkdir -p "$EMPTY_DIR/$TARGET_TAG"
          rsync -rv -e "ssh -o StrictHostKeyChecking=no" "$EMPTY_DIR/" "${SF_USER}@frs.sourceforge.net:/home/frs/project/${SF_PROJECT}/"
          rm -rf "$EMPTY_DIR"

          # 5. Bestanden synchroniseren + mirrors.txt
          echo "Bestanden synchroniseren..."
          ASSETS=$(gh release view "$TARGET_TAG" --repo "${{ github.repository }}" --json assets -q '.assets[] | {name: .name, url: .url}')
          > mirrors.txt

          if [ -z "$ASSETS" ]; then
            echo "Geen bestanden gevonden op GitHub"
          else
            echo "$ASSETS" | jq -c '.' | while read -r asset; do
              NAME=$(echo "$asset" | jq -r '.name')
              URL=$(echo "$asset" | jq -r '.url')
              echo "→ Uploaden: $NAME"

              curl -sL -H "Accept: application/octet-stream" -H "Authorization: token $GH_TOKEN" -o "$NAME" "$URL"

              # GitLab
              UPLOAD_URL="$PROJECT_API/packages/generic/resource-pack/$TARGET_TAG/$NAME"
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --upload-file "$NAME" "$UPLOAD_URL")
              if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
                echo "   Succesvol geüpload naar GitLab"
                echo "gitlab:${PACKAGE_BASE}/${NAME}" >> mirrors.txt
              else
                echo "   Fout bij GitLab (HTTP $HTTP_STATUS)"
                exit 1
              fi

              # SourceForge
              echo "   Uploaden naar SourceForge..."
              if rsync -avP -e "ssh -o StrictHostKeyChecking=no" "$NAME" "${SF_USER}@frs.sourceforge.net:${SF_REMOTE_DIR}/"; then
                echo "   Succesvol geüpload naar SourceForge"
                echo "sourceforge:https://sourceforge.net/projects/${SF_PROJECT}/files/${TARGET_TAG}/${NAME}/download" >> mirrors.txt
              else
                echo "   Fout bij SourceForge"
                exit 1
              fi
            done
          fi

          echo ""
          echo "Inhoud van mirrors.txt:"
          cat mirrors.txt

          # 6. mirrors.txt committen
          echo "mirrors.txt committen..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Toestand van release 1.0 bewaren; pas na een geslaagde sync, zodat een mislukte sync vanzelf opnieuw wordt geprobeerd
          echo "$MIRROR_STATE" > .mirror-state
          git add mirrors.txt .mirror-state
          git diff --staged --quiet || git commit -m "Update mirrors.txt (automatic sync)"
          git pull --rebase origin main
          git push
