name: Sync to GitLab + SourceForge

on:
  workflow_run:
    workflows: ["Update Resource Pack (GitHub tag 1.0)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq rsync
          curl -sL https://raw.githubusercontent.com/profclems/glab/trunk/scripts/install.sh | sudo bash

      - name: SourceForge SSH instellen
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync GitHub → GitLab + SourceForge + generate mirrors.txt
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: "1.0"
          GITLAB_REPO: "vulcanosoftwareinc/rp-repo-temp"
          SF_USER: "VulcanoCraft"   # <-- JE ECHTE SOURCEFORGE GEBRUIKERSNAAM
          SF_PROJECT: "vulcanocraft-resourcepack-src"
        run: |
          set -e
          echo "=== Start synchronisatie GitHub → GitLab + SourceForge ==="
          echo "$GITLAB_TOKEN" | glab auth login --stdin --hostname gitlab.com

          PROJECT_API="https://gitlab.com/api/v4/projects/$(echo $GITLAB_REPO | sed 's/\//%2F/g')"
          PACKAGE_BASE="https://gitlab.com/api/v4/projects/$(echo $GITLAB_REPO | sed 's/\//%2F/g')/packages/generic/resource-pack/$TARGET_TAG"
          SF_REMOTE_DIR="/home/frs/project/${SF_PROJECT}/${TARGET_TAG}"

          # -------------------------------------------------------
          # 1. Release volledig verwijderen
          # -------------------------------------------------------
          echo "Verwijderen van release $TARGET_TAG..."
          if glab release view "$TARGET_TAG" --repo "$GITLAB_REPO" > /dev/null 2>&1; then
            glab release delete "$TARGET_TAG" --repo "$GITLAB_REPO" --yes
          fi

          # -------------------------------------------------------
          # 2. README forceren
          # -------------------------------------------------------
          echo "README.md forceren op branch main..."
          FILE_API="$PROJECT_API/repository/files/README.md"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$FILE_API?ref=main")
          if [ "$HTTP_CODE" = "200" ]; then
            curl -s --request PUT \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{
                "branch": "main",
                "content": "# Resource Pack Mirror\n\nAutomatisch gesynchroniseerd vanaf GitHub.\n",
                "commit_message": "Update README (sync)"
              }' \
              "$FILE_API" > /dev/null
          else
            curl -s --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{
                "branch": "main",
                "content": "# Resource Pack Mirror\n\nAutomatisch gesynchroniseerd vanaf GitHub.\n",
                "commit_message": "Initialize repository with README"
              }' \
              "$FILE_API" > /dev/null
          fi

          # -------------------------------------------------------
          # 3. Nieuwe release 1.0 maken
          # -------------------------------------------------------
          echo "Nieuwe release 1.0 maken..."
          glab release create "$TARGET_TAG" \
            --repo "$GITLAB_REPO" \
            --name "Resource Pack 1.0" \
            --notes "Automatisch gesynchroniseerd vanaf GitHub (overschreven)" \
            --ref "main"

          # -------------------------------------------------------
          # 4. SourceForge map klaarzetten
          # -------------------------------------------------------
          echo "SourceForge-map voorbereiden..."
          ssh -o StrictHostKeyChecking=no "${SF_USER}@frs.sourceforge.net" "mkdir -p ${SF_REMOTE_DIR}"

          # -------------------------------------------------------
          # 5. Bestanden synchroniseren + mirrors.txt
          # -------------------------------------------------------
          echo "Bestanden synchroniseren..."
          ASSETS=$(gh release view "$TARGET_TAG" --repo "${{ github.repository }}" --json assets -q '.assets[] | {name: .name, url: .url}')
          > mirrors.txt

          if [ -z "$ASSETS" ]; then
            echo "Geen bestanden gevonden op GitHub"
          else
            echo "$ASSETS" | jq -c '.' | while read -r asset; do
              NAME=$(echo "$asset" | jq -r '.name')
              URL=$(echo "$asset" | jq -r '.url')
              echo "→ Uploaden: $NAME"

              curl -sL -H "Accept: application/octet-stream" -H "Authorization: token $GH_TOKEN" -o "$NAME" "$URL"

              # GitLab
              UPLOAD_URL="$PROJECT_API/packages/generic/resource-pack/$TARGET_TAG/$NAME"
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --upload-file "$NAME" "$UPLOAD_URL")
              if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
                echo "   Succesvol geüpload naar GitLab"
                echo "gitlab:${PACKAGE_BASE}/${NAME}" >> mirrors.txt
              else
                echo "   Fout bij GitLab (HTTP $HTTP_STATUS)"
                exit 1
              fi

              # SourceForge
              echo "   Uploaden naar SourceForge..."
              if rsync -avP -e "ssh -o StrictHostKeyChecking=no" "$NAME" "${SF_USER}@frs.sourceforge.net:${SF_REMOTE_DIR}/"; then
                echo "   Succesvol geüpload naar SourceForge"
                echo "sourceforge:https://sourceforge.net/projects/${SF_PROJECT}/files/${TARGET_TAG}/${NAME}/download" >> mirrors.txt
              else
                echo "   Fout bij SourceForge"
                exit 1
              fi
            done
          fi

          echo ""
          echo "Inhoud van mirrors.txt:"
          cat mirrors.txt

          # -------------------------------------------------------
          # 6. mirrors.txt committen
          # -------------------------------------------------------
          echo "mirrors.txt committen..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mirrors.txt
          git diff --staged --quiet || git commit -m "Update mirrors.txt (automatic sync)"
          git push
