name: Sync to All Mirrors + Update mirrors.txt

on:
  workflow_run:
    workflows: ["Update Resource Pack (GitHub tag 1.0)"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Sync to GitHub (tag 1.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: "1.0"
        run: |
          set -e
          echo "Sync GitHub tag 1.0"
          # Geen actie nodig, want we vertrouwen op de release zelf

      - name: Sync to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: "1.0"
          GITLAB_REPO: "vulcanosoftwareinc/rp-repo-temp"
        run: |
          set -e
          echo "Sync GitHub → GitLab..."

          echo "$GITLAB_TOKEN" | glab auth login --stdin --hostname gitlab.com

          if ! glab release view "$TARGET_TAG" --repo "$GITLAB_REPO" > /dev/null 2>&1; then
            glab release create "$TARGET_TAG" --repo "$GITLAB_REPO" --name "Resource Pack 1.0" --ref "main"
          fi

          ASSETS=$(gh release view "$TARGET_TAG" --repo "${{ github.repository }}" --json assets -q '.assets[] | {name: .name, url: .url}')

          if [ -z "$ASSETS" ]; then
            echo "Geen assets gevonden op GitHub"
            exit 0
          fi

          echo "$ASSETS" | jq -c '.' | while read -r asset; do
            NAME=$(echo "$asset" | jq -r '.name')
            URL=$(echo "$asset" | jq -r '.url')

            curl -sL -H "Accept: application/octet-stream" -H "Authorization: token $GH_TOKEN" -o "$NAME" "$URL"

            glab release upload "$TARGET_TAG" "$NAME" --repo "$GITLAB_REPO" --clobber
          done

          echo "GitLab sync voltooid."

      - name: Sync to jsDelivr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSDELIVR_TOKEN: ${{ secrets.JSDELIVR_TOKEN }}
          TARGET_TAG: "1.0"
        run: |
          set -e
          echo "Sync naar jsDelivr..."

          ASSETS=$(gh release view "$TARGET_TAG" --json assets -q '.assets[] | {name: .name, url: .url}')

          if [ -z "$ASSETS" ]; then
            echo "Geen assets gevonden"
            exit 0
          fi

          echo "$ASSETS" | jq -c '.' | while read -r asset; do
            NAME=$(echo "$asset" | jq -r '.name')
            URL=$(echo "$asset" | jq -r '.url')

            curl -sL -H "Accept: application/octet-stream" -H "Authorization: token $GH_TOKEN" -o "$NAME" "$URL"

            curl -s -X PUT -H "Authorization: token $JSDELIVR_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "Content-Disposition: attachment; filename=\"$NAME\"" \
              --upload-file "$NAME" \
              "https://data.jsdelivr.com/v1/package/gh/VulcanoSoftware/vulcanocraft_resourcepack@1.0/$NAME" \
              -w "%{http_code}\n" -o /dev/null
          done

          echo "jsDelivr sync voltooid."

      - name: Update mirrors.txt
        run: |
          set -e
          echo "Update mirrors.txt..."

          echo "github:https://github.com/VulcanoSoftware/vulcanocraft_resourcepack/releases/download/1.0/VulcanoPackEnhancedExplosions.zip" > mirrors.txt
          echo "gitlab:https://gitlab.com/api/v4/projects/vulcanosoftwareinc%2Frp-repo-temp/packages/generic/resource-pack/1.0/VulcanoPackEnhancedExplosions.zip" >> mirrors.txt
          echo "jsdelivr:https://cdn.jsdelivr.net/gh/VulcanoSoftware/vulcanocraft_resourcepack@1.0/VulcanoPackEnhancedExplosions.zip" >> mirrors.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add mirrors.txt
          git diff --staged --quiet || git commit -m "Update mirrors.txt (automatic sync from GitHub + GitLab + jsDelivr)"
          git push
